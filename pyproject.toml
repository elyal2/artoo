[project]
name = "artoo"
version = "0.1.0"
description = "ARTOO PoC: AI-ready data intelligence platform"
authors = [{ name = "Logicalis España", email = "data.ai@logicalis.com" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "asyncpg>=0.30",
  "fastmcp>=0.1",
  "anthropic>=0.40",
  "openai>=1.50",
  "boto3>=1.34",
  "python-dotenv>=1.0",
  "faker>=30.0",
  "sqlglot>=30.4.3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
